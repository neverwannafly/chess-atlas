<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Chess Atlas Compass Logo">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121e1d" />
      <stop offset="60%" stop-color="#0c1115" />
      <stop offset="100%" stop-color="#070a0d" />
    </radialGradient>

    <!-- Bezel Metallic Gradients -->
    <linearGradient id="bezelOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a6872" />
      <stop offset="35%" stop-color="#2d353b" />
      <stop offset="65%" stop-color="#1b2024" />
      <stop offset="100%" stop-color="#414c54" />
    </linearGradient>

    <linearGradient id="bezelInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14191d" />
      <stop offset="50%" stop-color="#252e35" />
      <stop offset="100%" stop-color="#0f1316" />
    </linearGradient>

    <!-- Emerald Radar / Knight Gradients -->
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#0e7a68" />
    </linearGradient>

    <linearGradient id="knightBodyGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#2af598" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#009efd" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0e7a68" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="256" y1="256" x2="380" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0" />
      <stop offset="70%" stop-color="#11998e" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38ef7d" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="112" fill="#0c1014" />
  <rect x="4" y="4" width="504" height="504" rx="108" fill="url(#bgGlow)" stroke="#222b33" stroke-width="2" />

  <!-- Outer Ambient Glow around Compass -->
  <circle cx="256" cy="256" r="214" stroke="#11998e" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- 1. Compass Outer Metallic Bezel Ring -->
  <circle cx="256" cy="256" r="206" fill="url(#bezelOuter)" stroke="#1a2126" stroke-width="4" />
  <circle cx="256" cy="256" r="196" fill="url(#bezelInner)" stroke="#3e4a52" stroke-width="1.5" />
  <circle cx="256" cy="256" r="168" fill="#080e12" stroke="#11998e" stroke-opacity="0.4" stroke-width="2" />

  <!-- 2. Compass Degree Notches & Markings on the Bezel -->
  <g stroke="#8c9ba5" stroke-linecap="round" opacity="0.75">
    <!-- 30-degree major ticks -->
    <line x1="256" y1="62" x2="256" y2="76" stroke-width="3" stroke="#38ef7d" />
    <line x1="256" y1="436" x2="256" y2="450" stroke-width="2.5" />
    <line x1="62" y1="256" x2="76" y2="256" stroke-width="2.5" />
    <line x1="436" y1="256" x2="450" y2="256" stroke-width="2.5" />

    <line x1="353" y1="88" x2="346" y2="100" stroke-width="2" />
    <line x1="424" y1="159" x2="412" y2="166" stroke-width="2" />
    <line x1="424" y1="353" x2="412" y2="346" stroke-width="2" />
    <line x1="353" y1="424" x2="346" y2="412" stroke-width="2" />
    <line x1="159" y1="424" x2="166" y2="412" stroke-width="2" />
    <line x1="88" y1="353" x2="100" y2="346" stroke-width="2" />
    <line x1="88" y1="159" x2="100" y2="166" stroke-width="2" />
    <line x1="159" y1="88" x2="166" y2="100" stroke-width="2" />
  </g>

  <!-- Compass Bezel Typography (N, E, S, W & Numbers) -->
  <text x="256" y="86" fill="#38ef7d" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" text-anchor="middle" filter="url(#neonGlow)">N</text>
  <text x="432" y="262" fill="#8c9ba5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">E</text>
  <text x="256" y="440" fill="#8c9ba5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">S</text>
  <text x="80" y="262" fill="#8c9ba5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">W</text>
  
  <text x="342" y="98" fill="#586772" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="middle">030</text>
  <text x="414" y="170" fill="#586772" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="middle">060</text>
  <text x="414" y="352" fill="#586772" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="middle">120</text>
  <text x="342" y="426" fill="#586772" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="middle">150</text>
  <text x="170" y="426" fill="#586772" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="middle">210</text>
  <text x="98" y="352" fill="#586772" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="middle">240</text>
  <text x="98" y="170" fill="#586772" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="middle">300</text>
  <text x="170" y="98" fill="#586772" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="middle">330</text>

  <!-- 3. Compass Face Internal Elements -->
  <!-- Topographic Contour Curves (Atlas) -->
  <path d="M120 220 Q160 180 200 230 T320 220 T390 260" stroke="#0e7a68" stroke-width="1" stroke-opacity="0.3" fill="none" />
  <path d="M100 280 Q170 330 256 310 T380 300" stroke="#0e7a68" stroke-width="1" stroke-opacity="0.25" fill="none" />
  <path d="M140 160 Q210 130 256 160 T370 170" stroke="#0e7a68" stroke-width="1" stroke-opacity="0.25" fill="none" />
  <path d="M150 350 Q230 380 300 350 T360 370" stroke="#0e7a68" stroke-width="1" stroke-opacity="0.2" fill="none" />

  <!-- Radar Range Rings -->
  <circle cx="256" cy="256" r="148" stroke="#11998e" stroke-width="1" stroke-opacity="0.35" fill="none" />
  <circle cx="256" cy="256" r="115" stroke="#11998e" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="4 4" fill="none" />
  <circle cx="256" cy="256" r="75" stroke="#11998e" stroke-width="1" stroke-opacity="0.3" fill="none" />
  <circle cx="256" cy="256" r="35" stroke="#11998e" stroke-width="1" stroke-opacity="0.2" fill="none" />

  <!-- Crosshairs -->
  <line x1="92" y1="256" x2="420" y2="256" stroke="#11998e" stroke-width="1" stroke-opacity="0.5" />
  <line x1="256" y1="92" x2="256" y2="420" stroke="#11998e" stroke-width="1" stroke-opacity="0.5" />

  <!-- Radar Scan Sweep (Active Tactical Beam) -->
  <path d="M256 256 L385 145 A165 165 0 0 0 355 110 Z" fill="url(#radarSweep)" />
  <line x1="256" y1="256" x2="385" y2="145" stroke="#38ef7d" stroke-width="2" stroke-opacity="0.85" filter="url(#neonGlow)" />
  <circle cx="340" cy="180" r="3" fill="#38ef7d" filter="url(#neonGlow)" />
  <circle cx="365" cy="225" r="2" fill="#38ef7d" opacity="0.6" />
  <circle cx="150" cy="210" r="2" fill="#38ef7d" opacity="0.5" />

  <!-- 4. Centerpiece: The Glowing Chess Knight -->
  <!-- Knight Silhouette & Glow Base -->
  <g id="tactical-knight" filter="url(#neonGlow)">
    <!-- Base Pedestal -->
    <path d="M210 338 C210 333 218 330 230 330 L282 330 C294 330 302 333 302 338 L210 338 Z" fill="#11998e" opacity="0.8" />
    <path d="M198 348 C198 342 208 340 220 340 L292 340 C304 340 314 342 314 348 L198 348 Z" fill="#38ef7d" />

    <!-- Knight Outer Body (Faceted Glass / Neon Silhouette) -->
    <path d="M298 326
             C298 296 292 268 274 238
             C266 226 258 212 258 196
             C258 192 260 184 264 174
             C255 178 244 187 240 197
             C234 194 227 196 222 200
             C214 207 208 216 199 227
             C192 234 178 245 170 256
             C164 264 168 272 178 272
             C187 272 198 266 207 260
             C200 274 196 293 198 326
             Z"
          fill="url(#knightBodyGrad)"
          stroke="#38ef7d"
          stroke-width="3"
          stroke-linejoin="round" />

    <!-- Internal Facet Lines (Geometric Tactical Grid) -->
    <path d="M240 197 L254 240 L207 260" stroke="#38ef7d" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M254 240 L274 238 L256 326" stroke="#38ef7d" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M222 200 L207 260" stroke="#38ef7d" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M254 240 L220 326" stroke="#38ef7d" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Knight Mane Facet Arc -->
    <path d="M264 174 C259 188 258 196 258 212 C258 232 266 248 274 266 C288 290 294 310 294 326"
          stroke="#2af598"
          stroke-width="3"
          stroke-linecap="round"
          fill="none" />

    <!-- Knight Glowing Eye (Tactical Crosshair Aperture) -->
    <circle cx="212" cy="228" r="6" fill="#080e12" stroke="#38ef7d" stroke-width="2" />
    <circle cx="212" cy="228" r="2.5" fill="#ffffff" filter="url(#intenseGlow)" />
  </g>

  <!-- Cardinal North Precision Indicator Pointer Arrow -->
  <polygon points="256,104 250,116 262,116" fill="#38ef7d" filter="url(#neonGlow)" />
</svg>